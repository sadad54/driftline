name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check src/ tests/ scripts/

      - name: Unit tests (no data required)
        run: pytest tests/test_data.py -v

      # Data-dependent tests (leakage/skew/quality-gate on the real dataset) run in a
      # separate job once the dataset is available as a CI artifact/cache — see Known Gaps
      # in TASKS.md until that's wired up.
