[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driftline"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
# BLE001 (blind `except Exception`) is intentionally allowed: this codebase uses it deliberately
# for availability checks (Docker daemon reachable? Feast store reachable?) where any failure
# mode should be treated the same way -- fall back / mark unavailable -- not for swallowing bugs.
ignore = ["BLE001"]
