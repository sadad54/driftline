name: driftline

services:
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: driftline-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
    ports:
      - "19092:19092"
      - "18082:18082"
      - "9644:9644" # admin API / metrics
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: redpandadata/console:v2.8.1
    container_name: driftline-redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8090:8080"
    depends_on:
      - redpanda

  redis:
    image: redis:7.4-alpine
    container_name: driftline-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "60", "1"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: driftline-postgres
    environment:
      POSTGRES_USER: driftline
      POSTGRES_PASSWORD: driftline
      POSTGRES_DB: driftline
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U driftline"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    container_name: driftline-mlflow
    command: >
      bash -c "pip install psycopg2-binary --quiet &&
      mlflow server
      --backend-store-uri postgresql://driftline:driftline@postgres:5432/driftline
      --default-artifact-root /mlruns
      --host 0.0.0.0
      --port 5000"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlruns
    depends_on:
      postgres:
        condition: service_healthy

  scorer:
    build:
      context: .
      dockerfile: serving/Dockerfile
    container_name: driftline-scorer
    # host networking rather than the compose bridge network + depends_on: feature_store.yaml's
    # online_store.connection_string is "localhost:6379" (matching how every other script in
    # this repo reaches Redis when run directly on the VM). On the default bridge network
    # "localhost" inside the container would resolve to the container itself, not the redis
    # service -- host networking is the simplest fix that doesn't require an
    # environment-specific feature_store.yaml. Linux-only, fine for this VM.
    network_mode: "host"
    volumes:
      - ./models/artifacts:/app/models/artifacts:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: driftline-prometheus
    # host networking to match the scorer (see comment above) -- "localhost:8000" in
    # monitoring/prometheus.yml's scrape target only resolves correctly this way.
    network_mode: "host"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.2.0
    container_name: driftline-grafana
    network_mode: "host"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: driftline
      GF_SERVER_HTTP_PORT: 3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - ./monitoring/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      - ./monitoring/grafana-dashboard.json:/var/lib/grafana/dashboards/driftline.json:ro
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  redpanda_data:
  redis_data:
  postgres_data:
  mlflow_artifacts:
