apiVersion: apps/v1
kind: Deployment
metadata:
  name: driftline-scorer
  labels:
    app: driftline-scorer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driftline-scorer
  template:
    metadata:
      labels:
        app: driftline-scorer
    spec:
      containers:
        - name: scorer
          image: driftline-scorer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: model-artifacts
              mountPath: /app/models/artifacts
              readOnly: true
      volumes:
        - name: model-artifacts
          hostPath:
            path: /home/HP/driftline/models/artifacts
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: driftline-scorer
spec:
  selector:
    app: driftline-scorer
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: driftline-scorer-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: driftline-scorer
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: driftline-scorer-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: driftline-scorer
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
